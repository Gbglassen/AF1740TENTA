```html
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fråga & Svar</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f2f2f2;
      font-family: Arial, sans-serif;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      width: 90%;
      max-width: 500px;
    }

    #text {
      font-size: 24px;
      margin-bottom: 30px;
      min-height: 80px;
    }

    button {
      padding: 12px 24px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #0077ff;
      color: white;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #005fd1;
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="text">Ekonomistyrningens utgångspunkter är bland annat ”vision, affärsidé och strategi”. Beskriv
de tre begreppen.</div>
    <button onclick="nextText()">Klicka</button>
  </div>

  <script>
    const texts = [
      "vision: vision är hur företaget vill bli uppfattade. Kan vara det framtida önskade tillståndet.

Affärsidé: affärsidé är det övergripande syftet för företaget.

Strategi: strategi beskriver hur ett företag ska arbeta för att uppnå sin vision och affärsidé.",
      "Vilken årstid gillar du mest?",
      "Sommaren är härlig med sol och bad!",
      "Vilken är din favoritmat?",
      "Pizza är en klassiker!",
      "Tack för att du testade sidan 😊"
    ];

    let index = 0;

    function nextText() {
      if (index < texts.length) {
        document.getElementById("text").innerText = texts[index];
        index++;
      }
    }
  </script>

</body>
</html>
